name: Dissect Local Video

on:
  workflow_dispatch:
    inputs:
      video_path:
        description: "Path of the video committed to this repository (for example: input/video.mp4)"
        required: true
        default: "input/video.mp4"
        type: string
      depth:
        description: "Analysis depth"
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - standard
          - deep

permissions:
  contents: read

jobs:
  dissect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Check input video
        env:
          VIDEO_PATH: ${{ inputs.video_path }}
        run: |
          if [ ! -f "$VIDEO_PATH" ]; then
            echo "::error::Video file not found: $VIDEO_PATH"
            echo "Upload the video into the repository first, then enter its repository path."
            exit 1
          fi

      - name: Run Dissect on local video
        env:
          VIDEO_PATH: ${{ inputs.video_path }}
          DEPTH: ${{ inputs.depth }}
        run: |
          uv run --script plugins/dissect/skills/dissect/scripts/dissect.py \
            "$VIDEO_PATH" \
            --depth "$DEPTH" \
            --out dissections \
            --no-comments

      - name: Upload analysis results
        uses: actions/upload-artifact@v4
        with:
          name: dissect-local-analysis-${{ github.run_id }}
          path: dissections/
          if-no-files-found: error
          retention-days: 1
