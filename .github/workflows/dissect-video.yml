name: Dissect Video Analysis

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Public video URL"
        required: true
        type: string
      depth:
        description: "Analysis depth"
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - standard
          - deep

permissions:
  contents: read

jobs:
  dissect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Run Dissect
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          DEPTH: ${{ inputs.depth }}
        run: |
          uv run --script plugins/dissect/skills/dissect/scripts/dissect.py \
            "$VIDEO_URL" \
            --depth "$DEPTH" \
            --out dissections

      - name: Upload analysis results
        uses: actions/upload-artifact@v4
        with:
          name: dissect-analysis
          path: dissections/
          if-no-files-found: error
          retention-days: 1
